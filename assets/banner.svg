<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Archana Kalburgi — retrieval systems that run on your own machine">
  <title>Archana Kalburgi — retrieval systems that run on your own machine</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#121a35"/>
      <stop offset="1" stop-color="#1a2448"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="230" fill="url(#glow)"/>

  <!-- left: identity -->
  <text x="72" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#eef2ff" letter-spacing="-1">Archana Kalburgi</text>
  <rect x="74" y="152" width="190" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="72" y="196" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#97a6cc">Retrieval systems that run on your own machine —</text>
  <text x="72" y="226" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#97a6cc">measured, not trusted.</text>
  <text x="72" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#5eead4" opacity="0.85" letter-spacing="0.5">python · chroma · ollama · on-device</text>

  <!-- right: a query finding three documents in a pile -->
  <g stroke="#5eead4" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M1068 160 L926 92"/>
    <path d="M1068 160 L870 160"/>
    <path d="M1068 160 L926 228"/>
  </g>

  <g fill="#19223f" stroke="#2c3862" stroke-width="1.2">
    <rect x="760" y="69" width="36" height="46" rx="5"/>
    <rect x="816" y="69" width="36" height="46" rx="5"/>
    <rect x="760" y="137" width="36" height="46" rx="5"/>
    <rect x="816" y="137" width="36" height="46" rx="5"/>
    <rect x="760" y="205" width="36" height="46" rx="5"/>
    <rect x="816" y="205" width="36" height="46" rx="5"/>
  </g>
  <g fill="#8e9cc4" opacity="0.4">
    <rect x="768" y="79" width="20" height="2.6" rx="1.3"/><rect x="768" y="87" width="14" height="2.6" rx="1.3"/>
    <rect x="824" y="79" width="20" height="2.6" rx="1.3"/><rect x="824" y="87" width="14" height="2.6" rx="1.3"/>
    <rect x="768" y="147" width="20" height="2.6" rx="1.3"/><rect x="768" y="155" width="14" height="2.6" rx="1.3"/>
    <rect x="824" y="147" width="20" height="2.6" rx="1.3"/><rect x="824" y="155" width="14" height="2.6" rx="1.3"/>
    <rect x="768" y="215" width="20" height="2.6" rx="1.3"/><rect x="768" y="223" width="14" height="2.6" rx="1.3"/>
    <rect x="824" y="215" width="20" height="2.6" rx="1.3"/><rect x="824" y="223" width="14" height="2.6" rx="1.3"/>
  </g>

  <!-- the matches -->
  <g fill="#132b33" stroke="#5eead4" stroke-width="1.6">
    <rect x="890" y="69" width="36" height="46" rx="5"/>
    <rect x="890" y="137" width="36" height="46" rx="5"/>
    <rect x="890" y="205" width="36" height="46" rx="5"/>
  </g>
  <g fill="#5eead4" opacity="0.75">
    <rect x="898" y="79" width="20" height="2.6" rx="1.3"/><rect x="898" y="87" width="14" height="2.6" rx="1.3"/>
    <rect x="898" y="147" width="20" height="2.6" rx="1.3"/><rect x="898" y="155" width="14" height="2.6" rx="1.3"/>
    <rect x="898" y="215" width="20" height="2.6" rx="1.3"/><rect x="898" y="223" width="14" height="2.6" rx="1.3"/>
  </g>

  <!-- query node -->
  <circle cx="1068" cy="160" r="26" fill="#0e1830" stroke="#5eead4" stroke-width="2"/>
  <g stroke="#5eead4" stroke-width="2.4" fill="none" stroke-linecap="round">
    <circle cx="1064" cy="156" r="8"/>
    <path d="M1070 162 L1076 168"/>
  </g>
</svg>
