<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Archana Kalburgi — retrieval systems that run on your own machine">
  <title>Archana Kalburgi — retrieval systems that run on your own machine</title>
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e0c8"/>
      <stop offset="0.55" stop-color="#c2d0b2"/>
      <stop offset="1" stop-color="#a9bc95"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2f6ec" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f2f6ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d7452"/>
      <stop offset="1" stop-color="#5d7452" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#3f4f3a" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#sage)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <circle cx="1010" cy="150" r="215" fill="url(#halo)"/>

  <text x="72" y="126" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#2e3a29" letter-spacing="-1">Archana Kalburgi</text>
  <rect x="74" y="145" width="180" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="72" y="187" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" fill="#44553e">Retrieval systems that run on your own machine —</text>
  <text x="72" y="216" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" fill="#44553e">measured, not trusted.</text>
  <text x="72" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#52684a" letter-spacing="0.5">python · chroma · ollama · on-device</text>

